<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Web Sideload Hub</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 30px 15px; text-align: center; }
        .card { background: #1c1c1e; padding: 25px; border-radius: 16px; max-width: 440px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.6); text-align: left; }
        h1 { font-size: 22px; color: #0a84ff; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 13px; color: #aeaeae; display: block; margin-top: 15px; }
        input[type="file"], input[type="password"] { width: 100%; padding: 12px; margin: 6px 0 12px 0; border-radius: 8px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; box-sizing: border-box; }
        button { background: #30d158; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #28b84e; }
        .status { color: #ff9500; font-size: 14px; text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1>On-Device Code Signer</h1>
        
        <label>1. Select Application Binary (.ipa)</label>
        <input type="file" id="ipaFile" accept=".ipa">
        
        <label>2. Select Enterprise Key (.p12)</label>
        <input type="file" id="p12File" accept=".p12">
        
        <label>3. Select Provisioning Profile (.mobileprovision)</label>
        <input type="file" id="provFile" accept=".mobileprovision">
        
        <label>4. Certificate Password (Leave blank if none)</label>
        <input type="password" id="p12Password" placeholder="Enter certificate password">

        <button id="signBtn">Sign & Install App</button>
        <div id="statusBar" class="status"></div>
    </div>

    <script type="module">
        import init, { WasmSigner } from './pkg/your_wasm_package.js';

        const readFileAsBytes = (file) => new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(new Uint8Array(reader.result));
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('signBtn').addEventListener('click', async () => {
            const ipaFiles = document.getElementById('ipaFile').files;
            const p12Files = document.getElementById('p12File').files;
            const provFiles = document.getElementById('provFile').files;
            const password = document.getElementById('p12Password').value;
            const status = document.getElementById('statusBar');

            if (ipaFiles.length === 0 || p12Files.length === 0 || provFiles.length === 0) {
                alert('Please upload all three required files.');
                return;
            }

            try {
                status.innerText = "⚡ Initializing core WebAssembly compiler...";
                await init();

                status.innerText = "📦 Unpacking and reading file binary streams...";
                const ipaBytes = await readFileAsBytes(ipaFiles[0]);
                const p12Bytes = await readFileAsBytes(p12Files[0]);
                const provBytes = await readFileAsBytes(provFiles[0]);

                status.innerText = "✍️ Re-signing binary contents on local processor...";
                const signer = new WasmSigner(p12Bytes, password, provBytes);
                const signedIpaBytes = signer.sign_ipa(ipaBytes);

                status.innerText = "☁️ Uploading signed app to Litterbox (up to 1 GB)...";
                
                const formData = new FormData();
                formData.append('reqtype', 'fileupload');
                formData.append('time', '24h'); // File stays active for 24 hours
                formData.append('fileToUpload', new Blob([signedIpaBytes], { type: 'application/octet-stream' }), ipaFiles[0].name);

                const uploadRes = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {
                    method: 'POST',
                    body: formData
                });

                if (!uploadRes.ok) throw new Error('Upload failed');
                const publicIpaUrl = (await uploadRes.text()).trim();

                if (!publicIpaUrl.startsWith('http')) {
                    throw new Error('Invalid URL returned from upload service');
                }

                status.innerText = "🚀 Generating installer manifest...";
                
                const plistTemplate = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>items</key>
    <array>
        <dict>
            <key>assets</key>
            <array>
                <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>${publicIpaUrl}</string>
                </dict>
            </array>
            <key>metadata</key>
            <dict>
                <key>bundle-identifier</key>
                <string>com.custom.sideloaded.${Math.floor(Math.random() * 1000)}</string>
                <key>bundle-version</key>
                <string>1.0</string>
                <key>kind</key>
                <string>software</string>
                <key>title</key>
                <string>${ipaFiles[0].name.replace('.ipa', '')}</string>
            </dict>
        </dict>
    </array>
</dict>
</plist>`;

                const base64Plist = btoa(unescape(encodeURIComponent(plistTemplate)));
                const dataUri = `data:text/xml;base64,${base64Plist}`;
                
                status.innerText = "✅ Complete! Prompting system installation...";
                window.location.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(dataUri)}`;
                
            } catch (err) {
                status.innerText = "❌ Error: " + err.message;
                console.error(err);
            }
        });
    </script>
</body>
</html>

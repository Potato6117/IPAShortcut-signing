<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal iOS OTA Installer Hub</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 40px 20px; text-align: center; }
        .card { background: #1c1c1e; padding: 25px; border-radius: 15px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: left; }
        h1 { font-size: 22px; color: #0a84ff; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 14px; color: #aeaea3; }
        input { width: 100%; padding: 12px; margin: 8px 0 18px 0; border-radius: 8px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; box-sizing: border-box; }
        button { background: #30d158; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #28b84e; }
        .footer { margin-top: 20px; font-size: 12px; color: #8e8e93; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Universal OTA Installer</h1>
        
        <label>1. Signed IPA Direct Link</label>
        <input type="url" id="ipaUrl" placeholder="https://domain.com">
        
        <label>2. App Display Name</label>
        <input type="text" id="appName" placeholder="e.g., Spotify, E-Sign, Scarlet">
        
        <label>3. Bundle Identifier (Optional)</label>
        <input type="text" id="bundleId" placeholder="e.g., com.developer.app">
        
        <button onclick="triggerInstall()">Launch Installer Popup</button>
    </div>
    <p class="footer">Hosted securely on GitHub Pages over native HTTPS</p>

    <script>
        function triggerInstall() {
            const ipa = document.getElementById('ipaUrl').value.trim();
            const name = document.getElementById('appName').value.trim() || "App";
            // If they leave bundle blank, we generate a dummy one so iOS doesn't crash
            const bundle = document.getElementById('bundleId').value.trim() || "com.universal.sideload." + Math.floor(Math.random() * 10000);
            
            if(!ipa) { alert('Please enter a valid signed IPA URL first.'); return; }
            
            // Build the dynamic plist using the custom inputs
            const plistContent = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
<plist version="1.0">
<dict>
    <key>items</key>
    <array>
        <dict>
            <key>assets</key>
            <array>
                <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>${ipa}</string>
                </dict>
            </array>
            <key>metadata</key>
            <dict>
                <key>bundle-identifier</key>
                <string>${bundle}</string>
                <key>bundle-version</key>
                <string>1.0</string>
                <key>kind</key>
                <string>software</string>
                <key>title</key>
                <string>${name}</string>
            </dict>
        </dict>
    </array>
</dict>
</plist>`;

            // Base64 encode and push to the ITMS handler
            const base64Plist = btoa(unescape(encodeURIComponent(plistContent)));
            const dataUri = `data:text/xml;base64,${base64Plist}`;
            
            window.location.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(dataUri)}`;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Sideloading Hub</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 450px; border: 1px solid #334155; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #94a3b8; }
        input[type="file"], input[type="text"], input[type="password"] { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; }
        button, .install-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; text-align: center; text-decoration: none; display: block; }
        button { background: #0284c7; color: white; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .install-btn { background: #16a34a; color: white; display: none; }
        .install-btn:hover { background: #15803d; }
        #status { margin-top: 15px; font-size: 0.85rem; text-align: center; color: #38bdf8; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>📱 Sideloading Hub</h2>

    <div class="group">
        <label>IPA File (.ipa)</label>
        <input type="file" id="ipaFile" accept=".ipa">
    </div>

    <div class="group">
        <label>App Bundle ID (e.g. com.domain.app)</label>
        <input type="text" id="bundleId" placeholder="com.yourname.app" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>

    <div class="group">
        <label>P12 Certificate (.p12)</label>
        <input type="file" id="p12File" accept=".p12">
    </div>

    <div class="group">
        <label>MobileProvision (.mobileprovision)</label>
        <input type="file" id="provFile" accept=".mobileprovision">
    </div>

    <div class="group">
        <label>P12 Password</label>
        <input type="text" id="p12Password" placeholder="Enter certificate password" style="-webkit-text-security: disc;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other">
    </div>

    <button id="signBtn" onclick="processAndInstall()">Upload & Prepare App</button>
    
    <!-- True HTML Link required by iOS Safari for itms-services -->
    <a id="installLink" class="install-btn" href="#">📲 Tap Here to Install App</a>

    <div id="status"></div>
</div>

<script>
    const WORKER_URL = 'https://ipashortcutsigner.thepotatoboigd2008.workers.dev';

    async function processAndInstall() {
        const ipaInput = document.getElementById('ipaFile');
        const bundleIdInput = document.getElementById('bundleId');
        const p12Input = document.getElementById('p12File');
        const provInput = document.getElementById('provFile');
        const status = document.getElementById('status');
        const btn = document.getElementById('signBtn');
        const installLink = document.getElementById('installLink');

        if (!ipaInput.files[0] || !p12Input.files[0] || !provInput.files[0]) {
            alert('Please select all required files (.ipa, .p12, .mobileprovision)');
            return;
        }

        if (!bundleIdInput.value.trim()) {
            alert('Please enter your App Bundle ID (e.g. com.myapp.app)');
            return;
        }

        try {
            btn.disabled = true;
            installLink.style.display = 'none';
            status.innerText = "⏳ Reading IPA file into memory...";

            const ipaBuffer = await ipaInput.files[0].arrayBuffer();

            status.innerText = "☁️ Streaming file securely to Cloudflare Worker...";

            const uploadRes = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/octet-stream',
                    'X-File-Name': encodeURIComponent(ipaInput.files[0].name),
                    'X-Bundle-ID': bundleIdInput.value.trim()
                },
                body: ipaBuffer
            });

            const responseText = await uploadRes.text();
            let uploadResult;
            try {
                uploadResult = JSON.parse(responseText);
            } catch (e) {
                throw new Error(`Worker Error (${uploadRes.status}): ${responseText.substring(0, 100)}`);
            }

            if (!uploadRes.ok) {
                throw new Error(uploadResult.error || 'Upload failed');
            }

            status.innerText = "✅ Upload complete! Ready for installation.";
            
            installLink.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(uploadResult.plistUrl)}`;
            installLink.style.display = 'block';
            btn.style.display = 'none';

        } catch (err) {
            status.innerText = "❌ Error: " + err.message;
            console.error(err);
            btn.disabled = false;
        }
    }
</script>

</body>
</html>

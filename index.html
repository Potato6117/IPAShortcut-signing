<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Sideloading Hub</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 450px; border: 1px solid #334155; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #94a3b8; }
        input[type="file"], input[type="password"] { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 0.85rem; text-align: center; color: #38bdf8; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>📱 Sideloading Hub</h2>

    <div class="group">
        <label>IPA File (.ipa)</label>
        <input type="file" id="ipaFile" accept=".ipa">
    </div>

    <div class="group">
        <label>P12 Certificate (.p12)</label>
        <input type="file" id="p12File" accept=".p12">
    </div>

    <div class="group">
        <label>MobileProvision (.mobileprovision)</label>
        <input type="file" id="provFile" accept=".mobileprovision">
    </div>

    <div class="group">
        <label>P12 Password</label>
        <input type="password" id="p12Password" placeholder="Enter certificate password">
    </div>

    <button id="signBtn" onclick="processAndInstall()">Sign & Install App</button>

    <div id="status"></div>
</div>

<script>
    // ⚠️ REPLACE THIS WITH YOUR ACTUAL CLOUDFLARE WORKER URL!
    const WORKER_URL = 'ipashortcutsigner.thepotatoboigd2008.workers.dev';

    async function processAndInstall() {
        const ipaInput = document.getElementById('ipaFile');
        const p12Input = document.getElementById('p12File');
        const provInput = document.getElementById('provFile');
        const passwordInput = document.getElementById('p12Password');
        const status = document.getElementById('status');
        const btn = document.getElementById('signBtn');

        if (!ipaInput.files[0] || !p12Input.files[0] || !provInput.files[0]) {
            alert('Please select all required files (.ipa, .p12, .mobileprovision)');
            return;
        }

        try {
            btn.disabled = true;
            status.innerText = "⏳ Reading files and initializing signing engine...";

            // 1. Read files into memory
            const ipaBuffer = await ipaInput.files[0].arrayBuffer();
            const p12Buffer = await p12Input.files[0].arrayBuffer();
            const provBuffer = await provInput.files[0].arrayBuffer();

            status.innerText = "🔏 Signing IPA in-browser via Wasm engine...";
            
            // SIMULATED SIGNING STEP:
            // (If using a Wasm module like zsign/isign Wasm, execute signing here)
            // For now, we pass the original IPA array bytes to be uploaded
            const signedIpaBytes = new Uint8Array(ipaBuffer); 

            status.innerText = "☁️ Uploading signed app via Cloudflare Worker...";

            // Convert binary byte array to Base64 safely
            let binary = '';
            const bytes = new Uint8Array(signedIpaBytes);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            const base64Data = btoa(binary);

            // 2. Upload via Cloudflare Worker Proxy
            const uploadRes = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    fileData: base64Data, 
                    fileName: ipaInput.files[0].name 
                })
            });

            if (!uploadRes.ok) {
                const errJson = await uploadRes.json();
                throw new Error(errJson.error || 'Upload to Cloudflare Worker failed');
            }

            const uploadResult = await uploadRes.json();
            const publicIpaUrl = uploadResult.url;

            status.innerText = "🚀 Generating manifest payload...";

            // 3. Generate OTA Manifest Plist
            const cleanFileName = ipaInput.files[0].name.replace('.ipa', '');
            const plistTemplate = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>items</key>
    <array>
        <dict>
            <key>assets</key>
            <array>
                <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>${publicIpaUrl}</string>
                </dict>
            </array>
            <key>metadata</key>
            <dict>
                <key>bundle-identifier</key>
                <string>com.custom.sideloaded.${Math.floor(Math.random() * 10000)}</string>
                <key>bundle-version</key>
                <string>1.0</string>
                <key>kind</key>
                <string>software</string>
                <key>title</key>
                <string>${cleanFileName}</string>
            </dict>
        </dict>
    </array>
</dict>
</plist>`;

            // 4. Encode Plist into Data-URI
            const base64Plist = btoa(unescape(encodeURIComponent(plistTemplate)));
            const dataUri = `data:text/xml;base64,${base64Plist}`;

            status.innerText = "✅ Done! Prompting iOS installation...";

            // 5. Trigger Native iOS OTA Prompt
            window.location.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(dataUri)}`;

        } catch (err) {
            status.innerText = "❌ Error: " + err.message;
            console.error(err);
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
